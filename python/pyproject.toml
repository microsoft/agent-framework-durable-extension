[project]
name = "agent-framework-durable-extension"
description = "Durable Task extensions for Microsoft Agent Framework."
authors = [{ name = "Microsoft", email = "af-support@microsoft.com" }]
readme = "../README.md"
requires-python = ">=3.10"
version = "1.0.0b260709"
license-files = ["../LICENSE"]
urls.homepage = "https://aka.ms/agent-framework"
urls.source = "https://github.com/microsoft/agent-framework-durable-extension/tree/main/python"
urls.release_notes = "https://github.com/microsoft/agent-framework-durable-extension/releases"
urls.issues = "https://github.com/microsoft/agent-framework-durable-extension/issues"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = []

[dependency-groups]
dev = [
    "uv==0.11.28",
    "flit==3.12.0",
    "ruff==0.15.20",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "pytest-xdist[psutil]==3.8.0",
    "pytest-timeout==2.4.0",
    "pytest-retry==1.7.0",
    "mypy==2.2.0",
    "pyright==1.1.411",
    "pyrefly==1.1.1",
    "ty==0.0.55",
    "zuban==0.8.2",
    "opentelemetry-sdk",
    "poethepoet==0.48.0",
    "rich>=13.7.1,<16.0.0",
    "tomli==2.4.1",
    "prek==0.4.8",
]
test = [
    "azure-monitor-opentelemetry",
    "mcp[ws]",
    "redis",
    # Model provider packages used by the sample workers that the integration
    # tests launch as subprocesses (agent_framework.openai / agent_framework.foundry).
    "agent-framework-openai>=1.10.1,<2",
    "agent-framework-foundry>=1.10.1,<2",
]

[tool.uv]
package = false
prerelease = "if-necessary-or-explicit"
# Security floors for transitive deps.
constraint-dependencies = ["litellm>=1.83.7", "fastapi-sso>=0.19.0"]
# python-multipart>=0.0.31 overrides litellm[proxy]'s exact pin of <=0.0.27 for security.
override-dependencies = ["mcp[ws]>=1.27.0", "uvicorn[standard]>=0.34.0", "python-multipart>=0.0.31"]
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux'",
    "sys_platform == 'win32'",
]

[tool.uv.workspace]
members = ["packages/durabletask"]

[tool.uv.sources]
agent-framework-durabletask = { workspace = true }

[tool.ruff]
line-length = 120
target-version = "py310"
fix = true
include = ["*.py", "*.pyi", "**/pyproject.toml", "*.ipynb"]
extend-exclude = [
    "[{][{]cookiecutter.package_name[}][}]",
]
preview = true

[tool.ruff.lint]
fixable = ["ALL"]
unfixable = []
select = [
    "ASYNC",
    "B",
    "CPY",
    "D",
    "E",
    "ERA",
    "F",
    "FIX",
    "I",
    "INP",
    "ISC",
    "Q",
    "RET",
    "RSE",
    "RUF",
    "SIM",
    "T20",
    "TD",
    "W",
    "T100",
    "S",
]
ignore = [
    "D100",
    "D104",
    "D421",
    "D418",
    "TD003",
    "FIX002",
    "ASYNC119",
    "B027",
    "B905",
    "RUF067",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["D", "INP", "TD", "ERA001", "RUF", "S"]
"samples/**" = ["D", "INP", "ERA001", "RUF", "S", "T201", "CPY"]
"*.ipynb" = ["CPY", "E501"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-copyright]
notice-rgx = "^# Copyright \\(c\\) Microsoft\\. All rights reserved\\."
min-file-size = 1

[tool.pytest.ini_options]
testpaths = ["packages/durabletask/tests"]
norecursedirs = ["**/lab/**"]
addopts = "-ra -q -r fEX"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = []
timeout = 60
markers = [
    "azure: marks tests as Azure provider specific",
    "azure-ai: marks tests as Azure AI provider specific",
    "openai: marks tests as OpenAI provider specific",
    "integration: marks tests as integration tests that require external services",
    "integration_test: marks tests as integration tests (alternative marker)",
    "sample: marks tests as sample tests",
    "requires_azure_openai: marks tests that require Azure OpenAI",
    "requires_dts: marks tests that require Durable Task Scheduler",
    "requires_redis: marks tests that require Redis",
]

[tool.coverage.run]
omit = [
    "**/__init__.py",
]

[tool.pyright]
exclude = ["**/tests/**", "samples/**", "**/.venv/**"]
typeCheckingMode = "strict"
reportUnnecessaryIsInstance = false
reportMissingTypeStubs = false
reportUnnecessaryCast = "error"
reportUnnecessaryTypeIgnoreComment = "error"

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false
no_implicit_optional = true
warn_return_any = false
warn_unused_ignores = false
show_error_codes = true

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.ty.rules]
unused-type-ignore-comment = "ignore"

[tool.bandit]
targets = ["agent_framework_durabletask"]
exclude_dirs = ["tests", "samples"]

[tool.poe]
executor.type = "uv"

[tool.poe.tasks.install]
help = "Install the Durable Task workspace package and dependency groups."
cmd = "uv sync --all-packages --group dev --group test"

[tool.poe.tasks.lint]
help = "Run Ruff checks for the Durable Task package and samples."
cmd = "ruff check packages/durabletask samples"

[tool.poe.tasks.format]
help = "Run Ruff formatting for the Durable Task package and samples."
cmd = "ruff format packages/durabletask samples"

[tool.poe.tasks.mypy]
help = "Run MyPy for the Durable Task package source."
cmd = "mypy --config-file packages/durabletask/pyproject.toml packages/durabletask/agent_framework_durabletask"

[tool.poe.tasks.pyright]
help = "Run Pyright for the Durable Task package source."
cmd = "pyright -p packages/durabletask/pyproject.toml"

[tool.poe.tasks.test]
help = "Run the Durable Task unit tests."
cmd = "pytest -m \"not integration\" packages/durabletask/tests"

[tool.poe.tasks.build]
help = "Build the Durable Task package distributions."
cmd = "uv build packages/durabletask --out-dir dist"

[tool.poe.tasks.clean-dist]
help = "Remove generated Python package artifacts."
cmd = "python -c \"import shutil; shutil.rmtree('dist', ignore_errors=True)\""
