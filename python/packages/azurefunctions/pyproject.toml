[project]
name = "agent-framework-azurefunctions"
description = "Azure Functions integration for Microsoft Agent Framework."
authors = [{ name = "Microsoft", email = "af-support@microsoft.com"}]
readme = "README.md"
# azure-functions-durable 2.x requires 3.13+: on older Functions Python workers the
# worker's dependencies are not isolated from the app's, which collides with the
# durable runtime's grpc at load time. 3.13 enables worker dependency isolation.
requires-python = ">=3.13"
version = "1.0.0b260709"
license-files = ["LICENSE"]
urls.homepage = "https://aka.ms/agent-framework"
urls.source = "https://github.com/microsoft/agent-framework-durable-extension/tree/main/python"
urls.release_notes = "https://github.com/microsoft/agent-framework-durable-extension/releases"
urls.issues = "https://github.com/microsoft/agent-framework-durable-extension/issues"
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
    "agent-framework-core>=1.11.0,<2",
    "agent-framework-durabletask>=1.0.0b260709,<2",
    "azure-functions>=2.3.0b2,<3",
    "azure-functions-durable>=2.0.0b1,<3",
]

[dependency-groups]
# This package is a standalone uv project (see the note in ../../pyproject.toml),
# so it cannot inherit the workspace root's groups. Keep the pinned versions here
# in lockstep with ../../pyproject.toml -- that file is the source of truth.
dev = [
    "uv==0.11.28",
    "flit==3.12.0",
    "ruff==0.15.20",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "pytest-xdist[psutil]==3.8.0",
    "pytest-timeout==2.4.0",
    "pytest-retry==1.7.0",
    "mypy==2.2.0",
    "pyright==1.1.411",
    "pyrefly==1.1.1",
    "ty==0.0.55",
    "zuban==0.8.2",
    "opentelemetry-sdk",
    "poethepoet==0.48.0",
    "rich>=13.7.1,<16.0.0",
    "tomli==2.4.1",
    "prek==0.4.8",
]
test = [
    "azure-monitor-opentelemetry",
    "mcp[ws]",
    "redis",
    "agent-framework-openai>=1.10.1,<2",
    "agent-framework-foundry>=1.10.1,<2",
]

[tool.uv]
prerelease = "if-necessary-or-explicit"
# Mirrors the security floors/overrides in ../../pyproject.toml.
constraint-dependencies = ["litellm>=1.83.7", "fastapi-sso>=0.19.0"]
override-dependencies = ["mcp[ws]>=1.27.0", "uvicorn[standard]>=0.34.0", "python-multipart>=0.0.31"]
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux'",
    "sys_platform == 'win32'"
]

[tool.uv.sources]
agent-framework-durabletask = { path = "../durabletask", editable = true }

[tool.uv-dynamic-versioning]
fallback-version = "0.0.0"

[tool.pytest.ini_options]
testpaths = 'tests'
pythonpath = ["tests/integration_tests"]
addopts = "-ra -q -r fEX"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore:Support for class-based `config` is deprecated:DeprecationWarning:pydantic.*"
]
timeout = 300
markers = [
    "integration: marks tests as integration tests (require running function app)",
    "orchestration: marks tests that use orchestrations (require Azurite)",
]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.coverage.run]
omit = [
    "**/__init__.py"
]

[tool.pyright]
extends = "../../pyproject.toml"
include = ["agent_framework_azurefunctions"]

[tool.bandit]
targets = ["agent_framework_azurefunctions"]
exclude_dirs = ["tests"]

[tool.poe]
executor.type = "uv"
include = "../../shared_tasks.toml"

[tool.poe.tasks.mypy]
help = "Run MyPy for this package's tests."
cmd = "mypy --config-file $POE_ROOT/pyproject.toml tests"

[tool.poe.tasks.test]
help = "Run the default unit test suite for this package."
cmd = 'pytest -m "not integration" --cov=agent_framework_azurefunctions --cov-report=term-missing:skip-covered tests'

[build-system]
requires = ["flit-core >= 3.11,<4.0"]
build-backend = "flit_core.buildapi"
