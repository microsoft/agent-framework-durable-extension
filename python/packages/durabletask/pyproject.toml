[project]
name = "agent-framework-durabletask"
description = "Durable Task integration for Microsoft Agent Framework."
authors = [{ name = "Microsoft", email = "af-support@microsoft.com"}]
readme = "README.md"
requires-python = ">=3.10"
version = "1.0.0b260709"
license-files = ["LICENSE"]
urls.homepage = "https://aka.ms/agent-framework"
urls.source = "https://github.com/microsoft/agent-framework-durable-extension/tree/main/python"
urls.release_notes = "https://github.com/microsoft/agent-framework-durable-extension/releases"
urls.issues = "https://github.com/microsoft/agent-framework-durable-extension/issues"
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
    "agent-framework-core>=1.11.0,<2",
    "durabletask>=1.5.0,<2",
    "durabletask-azuremanaged>=1.4.0,<2",
    "python-dateutil>=2.8.0,<3",
]

[dependency-groups]
dev = [
    "types-python-dateutil==2.9.0.20260518",
]

[tool.uv]
prerelease = "if-necessary-or-explicit"
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux'",
    "sys_platform == 'win32'"
]

[tool.uv-dynamic-versioning]
fallback-version = "0.0.0"

[tool.pytest.ini_options]
testpaths = 'tests'
pythonpath = ["tests/integration_tests"]
addopts = "-ra -q -r fEX"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore:Support for class-based `config` is deprecated:DeprecationWarning:pydantic.*"
]
timeout = 120
markers = [
    "integration: marks tests as integration tests",
    "integration_test: marks tests as integration tests (alternative marker)",
    "sample: marks tests as sample tests",
    "requires_foundry: marks tests that require Azure AI Foundry",
    "requires_dts: marks tests that require Durable Task Scheduler",
    "requires_redis: marks tests that require Redis"
]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.coverage.run]
omit = [
    "**/__init__.py"
]

[tool.pyright]
extends = "../../pyproject.toml"
include = ["agent_framework_durabletask"]

[tool.bandit]
targets = ["agent_framework_durabletask"]
exclude_dirs = ["tests"]

[tool.poe]
executor.type = "uv"
include = "../../shared_tasks.toml"

[tool.poe.tasks.mypy]
help = "Run MyPy for this package's tests."
cmd = "mypy --config-file $POE_ROOT/pyproject.toml tests"

[tool.poe.tasks.test]
help = "Run the default unit test suite for this package."
cmd = 'pytest -m "not integration" --cov=agent_framework_durabletask --cov-report=term-missing:skip-covered tests'

[build-system]
requires = ["flit-core >= 3.11,<4.0"]
build-backend = "flit_core.buildapi"
