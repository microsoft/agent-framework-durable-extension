name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      date_suffix:
        description: "YYMMDD date suffix (e.g., 261022)"
        required: true
        type: string
      dotnet_version_prefix:
        description: ".NET VersionPrefix (e.g., 1.16.0)"
        required: false
        default: "1.16.0"
        type: string
      dotnet_version:
        description: "Explicit .NET version override (defaults to <prefix>-preview.<date_suffix>.1)"
        required: false
        type: string
      python_version:
        description: "Explicit Python version override (defaults to 1.0.0b<date_suffix>)"
        required: false
        type: string
      skip_dotnet:
        description: "Skip .NET version bump and changelog stamping"
        required: false
        default: false
        type: boolean
      skip_python:
        description: "Skip Python version bump and changelog stamping"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare-release:
    name: Bump versions, stamp changelogs, and open PR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install uv==0.11.28

      - name: Run prepare-release script
        env:
          INPUT_DATE_SUFFIX: ${{ inputs.date_suffix }}
          INPUT_DOTNET_PREFIX: ${{ inputs.dotnet_version_prefix }}
          INPUT_DOTNET_VERSION: ${{ inputs.dotnet_version }}
          INPUT_PYTHON_VERSION: ${{ inputs.python_version }}
          INPUT_SKIP_DOTNET: ${{ inputs.skip_dotnet }}
          INPUT_SKIP_PYTHON: ${{ inputs.skip_python }}
        run: |
          args=(--date-suffix "$INPUT_DATE_SUFFIX")
          if [[ -n "$INPUT_DOTNET_PREFIX" ]]; then
            args+=(--dotnet-version-prefix "$INPUT_DOTNET_PREFIX")
          fi
          if [[ -n "$INPUT_DOTNET_VERSION" ]]; then
            args+=(--dotnet-version "$INPUT_DOTNET_VERSION")
          fi
          if [[ -n "$INPUT_PYTHON_VERSION" ]]; then
            args+=(--python-version "$INPUT_PYTHON_VERSION")
          fi
          if [[ "$INPUT_SKIP_DOTNET" == "true" ]]; then
            args+=(--skip-dotnet)
          fi
          if [[ "$INPUT_SKIP_PYTHON" == "true" ]]; then
            args+=(--skip-python)
          fi
          python eng/scripts/prepare-release.py "${args[@]}"

      - name: Refresh Python lockfiles
        if: ${{ !inputs.skip_python }}
        run: |
          uv lock --directory python
          uv lock --directory python/packages/azurefunctions

      - name: Generate preview release notes
        run: |
          python eng/scripts/generate-release-notes.py --output artifacts/release-notes-preview.md
          cat artifacts/release-notes-preview.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create Release Preparation PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATE_SUFFIX: ${{ inputs.date_suffix }}
        run: |
          BRANCH="release/prepare-${DATE_SUFFIX}"
          TITLE="chore: prepare release (${DATE_SUFFIX})"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add dotnet/nuget/nuget-package.props \
                  dotnet/src/Microsoft.Agents.AI.DurableTask/CHANGELOG.md \
                  dotnet/src/Microsoft.Agents.AI.Hosting.AzureFunctions/CHANGELOG.md \
                  python/pyproject.toml \
                  python/packages/durabletask/pyproject.toml \
                  python/packages/azurefunctions/pyproject.toml \
                  python/CHANGELOG.md \
                  python/uv.lock \
                  python/packages/azurefunctions/uv.lock
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "$TITLE"
          git push -u origin "$BRANCH" --force
          if pr_url=$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "$TITLE" \
            --body-file artifacts/release-notes-preview.md 2>&1); then
            echo "Created PR: $pr_url"
            {
              echo ""
              echo "## Release Preparation PR"
              echo ""
              echo "Created pull request: $pr_url"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::gh pr create failed (GITHUB_TOKEN is not permitted to create PRs by organization policy). Branch '${BRANCH}' was pushed; see step summary for one-click PR creation."
            echo "$pr_url"
            {
              echo ""
              echo "## Manual PR Creation Required"
              echo ""
              echo "GitHub Actions is not permitted to create pull requests in this repository with \`GITHUB_TOKEN\`, so the release preparation branch was pushed to origin."
              echo ""
              echo "- **Branch:** \`${BRANCH}\`"
              echo "- **Compare & Open PR:** https://github.com/${{ github.repository }}/compare/main...${BRANCH}?expand=1"
              echo ""
              echo "### Create the PR via GitHub CLI"
              echo ""
              echo "\`\`\`bash"
              echo "gh pr create --repo ${{ github.repository }} --base main \\"
              echo "  --head ${BRANCH} \\"
              echo "  --title \"${TITLE}\" \\"
              echo "  --body-file artifacts/release-notes-preview.md"
              echo "\`\`\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
