name: Python Integration Tests

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"

jobs:
  integration-tests:
    name: Durable Task integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: integration
    env:
      DURABLE_TASK_SCHEDULER_CONNECTION_STRING: Endpoint=http://localhost:8080;TaskHub=default;Authentication=None
      REDIS_CONNECTION_STRING: redis://localhost:6379
      FOUNDRY_PROJECT_ENDPOINT: ${{ secrets.FOUNDRY_PROJECT_ENDPOINT }}
      FOUNDRY_MODEL: ${{ secrets.FOUNDRY_MODEL }}
      AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
      AZURE_OPENAI_MODEL: ${{ secrets.AZURE_OPENAI_MODEL || secrets.AZURE_OPENAI_DEPLOYMENT_NAME }}
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Start integration infrastructure
        uses: ./.github/actions/azure-functions-integration-setup

      - name: Sync workspace
        working-directory: python
        run: uv sync --all-packages --group dev --group test

      - name: Integration tests
        working-directory: python
        run: uv run pytest packages/durabletask/tests/integration_tests -m integration -n logical --dist worksteal --timeout 480
