name: Create GitHub Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update (defaults to v<GitTag> from dotnet/nuget/nuget-package.props)"
        required: false
        type: string
      target:
        description: "Target commit SHA or branch when creating a new tag via workflow_dispatch (defaults to main)"
        required: false
        default: "main"
        type: string
      dotnet_version:
        description: "Optional .NET version override"
        required: false
        type: string
      python_version:
        description: "Optional Python version override"
        required: false
        type: string
      prerelease:
        description: "Mark release as prerelease"
        required: false
        default: true
        type: boolean
      draft:
        description: "Create release as a draft"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  create-release:
    name: Generate notes from CHANGELOG.md and publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Resolve release versions and generate release notes
        id: notes
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DOTNET_VERSION: ${{ inputs.dotnet_version }}
          INPUT_PYTHON_VERSION: ${{ inputs.python_version }}
        run: |
          dotnet_ver="$INPUT_DOTNET_VERSION"
          if [[ -z "$dotnet_ver" ]]; then
            dotnet_ver=$(python -c "from pathlib import Path; import sys; sys.path.insert(0, 'eng/scripts'); import generate_release_notes as g; print(g.read_dotnet_version(Path('dotnet/nuget/nuget-package.props')))" 2>/dev/null || true)
          fi
          if [[ -z "$dotnet_ver" ]]; then
            dotnet_ver=$(sed -n 's:.*<GitTag>\([^<]*\)</GitTag>.*:\1:p' dotnet/nuget/nuget-package.props | tr -d '[:space:]')
          fi

          if [[ "$EVENT_NAME" == "push" ]]; then
            tag="$REF_NAME"
          elif [[ -n "$INPUT_TAG" ]]; then
            tag="$INPUT_TAG"
          else
            tag="v${dotnet_ver#v}"
          fi

          args=(--output artifacts/release-notes.md)
          if [[ -n "$INPUT_DOTNET_VERSION" ]]; then
            args+=(--dotnet-version "$INPUT_DOTNET_VERSION")
          elif [[ "$tag" == v* ]]; then
            args+=(--dotnet-version "${tag#v}")
          fi
          if [[ -n "$INPUT_PYTHON_VERSION" ]]; then
            args+=(--python-version "$INPUT_PYTHON_VERSION")
          fi

          python eng/scripts/generate-release-notes.py "${args[@]}"
          cat artifacts/release-notes.md >> "$GITHUB_STEP_SUMMARY"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.notes.outputs.tag }}
          TARGET: ${{ inputs.target || github.sha }}
          PRERELEASE: ${{ inputs.prerelease }}
          DRAFT: ${{ inputs.draft }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Updating existing GitHub release $TAG..."
            gh release edit "$TAG" \
              --title "$TAG" \
              --notes-file artifacts/release-notes.md
          else
            echo "Creating GitHub release $TAG..."
            create_args=("$TAG" --title "$TAG" --notes-file artifacts/release-notes.md --target "$TARGET")
            if [[ "$PRERELEASE" == "true" || "$TAG" == *-* ]]; then
              create_args+=(--prerelease)
            fi
            if [[ "$DRAFT" == "true" ]]; then
              create_args+=(--draft)
            fi
            gh release create "${create_args[@]}"
          fi
