name: Create GitHub Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update (defaults to v<dotnet_version>, or v<GitTag> from dotnet/nuget/nuget-package.props)"
        required: false
        type: string
      target:
        description: "Target commit SHA or branch when creating a new tag via workflow_dispatch (defaults to main)"
        required: false
        default: "main"
        type: string
      dotnet_version:
        description: "Optional .NET version override"
        required: false
        type: string
      python_version:
        description: "Optional Python version override"
        required: false
        type: string
      prerelease:
        description: "Mark release as prerelease"
        required: false
        default: true
        type: boolean
      draft:
        description: "Create release as a draft"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  create-release:
    name: Generate notes from release source and create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: ${{ github.workflow_sha }}

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Test release tooling
        run: python -m unittest discover -s eng/scripts/tests -v

      - name: Preserve release notes generator
        run: cp eng/scripts/generate-release-notes.py "$RUNNER_TEMP/generate-release-notes.py"

      - name: Checkout release target
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: ${{ inputs.target || github.ref }}

      - name: Resolve release source and generate release notes
        id: notes
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DOTNET_VERSION: ${{ inputs.dotnet_version }}
          INPUT_PYTHON_VERSION: ${{ inputs.python_version }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then
            tag="$REF_NAME"
          elif [[ -n "$INPUT_TAG" ]]; then
            tag="$INPUT_TAG"
          else
            dotnet_ver="$INPUT_DOTNET_VERSION"
            if [[ -z "$dotnet_ver" ]]; then
              dotnet_ver=$(python -c "from pathlib import Path; import os, runpy; g = runpy.run_path(os.path.join(os.environ['RUNNER_TEMP'], 'generate-release-notes.py')); print(g['read_dotnet_version'](Path('dotnet/nuget/nuget-package.props')))")
            fi
            tag="v${dotnet_ver#v}"
          fi

          git check-ref-format "refs/tags/$tag"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            source_sha=$(git rev-parse "refs/tags/$tag^{commit}")
          elif [[ "$EVENT_NAME" == "push" ]]; then
            echo "::error::Pushed tag $tag was not found in the checkout."
            exit 1
          else
            source_sha=$(git rev-parse HEAD)
          fi
          git checkout --detach "$source_sha"

          args=(--repo-root "$GITHUB_WORKSPACE" --source-ref "$source_sha" --output artifacts/release-notes.md)
          if [[ -n "$INPUT_DOTNET_VERSION" ]]; then
            args+=(--dotnet-version "$INPUT_DOTNET_VERSION")
          elif [[ "$tag" == v* ]]; then
            args+=(--dotnet-version "${tag#v}")
          fi
          if [[ -n "$INPUT_PYTHON_VERSION" ]]; then
            args+=(--python-version "$INPUT_PYTHON_VERSION")
          fi
          python "$RUNNER_TEMP/generate-release-notes.py" "${args[@]}"
          cat artifacts/release-notes.md >> "$GITHUB_STEP_SUMMARY"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.notes.outputs.tag }}
          TARGET: ${{ steps.notes.outputs.source_sha }}
          PRERELEASE: ${{ inputs.prerelease }}
          DRAFT: ${{ inputs.draft }}
        run: |
          set -euo pipefail
          # Listing includes drafts for this token; API failures must not look like a missing release.
          existing=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | select(.tag_name == env.TAG) | .draft')
          if [[ "$existing" == "false" ]]; then
            echo "Leaving already-published GitHub release $TAG unchanged."
            echo "Release $TAG was not updated; only an existing draft can be refreshed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ -n "$existing" && "$existing" != "true" ]]; then
            echo "::error::Multiple releases match $TAG; resolve the ambiguity before rerunning."
            exit 1
          fi
          if [[ "$existing" == "true" ]]; then
            echo "Updating existing draft GitHub release $TAG..."
            gh release edit "$TAG" \
              --title "$TAG" \
              --target "$TARGET" \
              --notes-file artifacts/release-notes.md
          else
            echo "Creating GitHub release $TAG..."
            create_args=("$TAG" --title "$TAG" --notes-file artifacts/release-notes.md --target "$TARGET")
            if [[ "$PRERELEASE" == "true" || "$TAG" == *-* ]]; then
              create_args+=(--prerelease)
            fi
            if [[ "$DRAFT" == "true" ]]; then
              create_args+=(--draft)
            fi
            gh release create "${create_args[@]}"
          fi
          echo "GitHub release $TAG does not confirm registry publication. Follow eng/README.md's recommended publication checklist; this workflow does not verify ADO publishing." >> "$GITHUB_STEP_SUMMARY"
