name: Publish .NET Packages

on:
  workflow_dispatch:
  push:
    tags:
      - "dotnet-*"

jobs:
  publish:
    name: Pack and publish NuGet packages
    runs-on: ubuntu-latest
    environment: release
    env:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: dotnet/global.json

      - name: Restore
        working-directory: dotnet
        run: dotnet restore agent-framework-durable-extension.slnx

      - name: Pack DurableTask
        working-directory: dotnet
        run: dotnet pack src/Microsoft.Agents.AI.DurableTask/Microsoft.Agents.AI.DurableTask.csproj --configuration Publish --output ../artifacts/packages

      - name: Pack Azure Functions hosting
        working-directory: dotnet
        run: dotnet pack src/Microsoft.Agents.AI.Hosting.AzureFunctions/Microsoft.Agents.AI.Hosting.AzureFunctions.csproj --configuration Publish --output ../artifacts/packages

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-packages
          path: artifacts/packages/*

      - name: Publish to NuGet
        if: ${{ env.NUGET_API_KEY != '' }}
        run: dotnet nuget push "artifacts/packages/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
