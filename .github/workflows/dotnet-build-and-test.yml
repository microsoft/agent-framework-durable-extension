name: .NET Build and Test

on:
  pull_request:
    paths:
      - "dotnet/**"
      - ".github/workflows/dotnet-build-and-test.yml"
  push:
    branches: [main]
    paths:
      - "dotnet/**"
      - ".github/workflows/dotnet-build-and-test.yml"
  workflow_dispatch:

jobs:
  build-test-pack:
    name: Build, unit test, and pack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: dotnet/global.json

      - name: Restore
        working-directory: dotnet
        run: dotnet restore agent-framework-durable-extension.slnx

      - name: Build
        working-directory: dotnet
        run: dotnet build agent-framework-durable-extension.slnx --configuration Release --no-restore

      - name: Run DurableTask unit tests
        working-directory: dotnet
        run: dotnet test tests/Microsoft.Agents.AI.DurableTask.UnitTests/Microsoft.Agents.AI.DurableTask.UnitTests.csproj --configuration Release --no-build --report-xunit-trx --results-directory ../artifacts/test-results

      - name: Run Azure Functions unit tests
        working-directory: dotnet
        run: dotnet test tests/Microsoft.Agents.AI.Hosting.AzureFunctions.UnitTests/Microsoft.Agents.AI.Hosting.AzureFunctions.UnitTests.csproj --configuration Release --no-build --report-xunit-trx --results-directory ../artifacts/test-results

      - name: Pack DurableTask
        working-directory: dotnet
        run: dotnet pack src/Microsoft.Agents.AI.DurableTask/Microsoft.Agents.AI.DurableTask.csproj --configuration Release --no-build --output ../artifacts/packages

      - name: Pack Azure Functions Durable Task extension registration
        working-directory: dotnet
        run: dotnet pack src/Microsoft.Agents.AI.Hosting.AzureFunctions.Extensions.DurableTask/Microsoft.Agents.AI.Hosting.AzureFunctions.Extensions.DurableTask.csproj --configuration Release --no-build --output ../artifacts/packages

      - name: Pack Azure Functions hosting
        working-directory: dotnet
        run: dotnet pack src/Microsoft.Agents.AI.Hosting.AzureFunctions/Microsoft.Agents.AI.Hosting.AzureFunctions.csproj --configuration Release --no-build --output ../artifacts/packages

      - name: Upload packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dotnet-packages
          path: artifacts/packages/*

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dotnet-test-results
          path: artifacts/test-results/*
