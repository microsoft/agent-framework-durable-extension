name: Python Build and Test

on:
  pull_request:
    paths:
      - "python/**"
      - ".github/workflows/python-merge-tests.yml"
  push:
    branches: [main]
    paths:
      - "python/**"
      - ".github/workflows/python-merge-tests.yml"
  workflow_dispatch:

jobs:
  minimum-dependencies:
    name: Python minimum dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Sync locked baseline
        working-directory: python
        run: uv sync --frozen --all-packages --group dev --group test

      - name: Resolve exact supported minimums together
        working-directory: python
        run: |
          uv pip install --group dev --group test \
            -e packages/durabletask -e packages/azurefunctions \
            "agent-framework-core==1.19.0" "pydantic==2.11.0" "opentelemetry-api==1.39.0" \
            "durabletask==1.7.1" "durabletask-azuremanaged==1.4.0" "azure-functions-durable==1.3.1" \
            opentelemetry-instrumentation-logging
          uv pip check

      - name: Verify versions and run unit tests without resynchronizing
        working-directory: python
        run: |
          uv run --no-sync python -c "import importlib.metadata as m; assert m.version('agent-framework-core') == '1.19.0'; assert m.version('pydantic') == '2.11.0'; assert m.version('opentelemetry-api') == '1.39.0'"
          uv run --no-sync python -c "import importlib.metadata as m; assert m.version('durabletask') == '1.7.1'; assert m.version('durabletask-azuremanaged') == '1.4.0'; assert m.version('azure-functions-durable') == '1.3.1'"
          uv run --no-sync pytest -m "not integration" packages/durabletask/tests packages/azurefunctions/tests

  build-test-package:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Sync workspace
        working-directory: python
        run: uv sync --all-packages --group dev --group test

      - name: Ruff
        working-directory: python
        run: uv run ruff check packages/durabletask packages/azurefunctions

      - name: Pyright (source)
        working-directory: python
        run: |
          uv run pyright -p packages/durabletask/pyproject.toml
          uv run pyright -p packages/azurefunctions/pyproject.toml

      - name: MyPy (tests)
        working-directory: python
        run: |
          uv run mypy --config-file pyproject.toml packages/durabletask/tests
          uv run mypy --config-file pyproject.toml packages/azurefunctions/tests

      - name: Unit tests
        working-directory: python
        run: uv run pytest -m "not integration" packages/durabletask/tests packages/azurefunctions/tests --cov=agent_framework_durabletask --cov=agent_framework_azurefunctions --cov-report=term-missing:skip-covered

      - name: Build package
        working-directory: python
        run: |
          uv build packages/durabletask --out-dir dist
          uv build packages/azurefunctions --out-dir dist

      - name: Upload package
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package
          path: python/dist/*
