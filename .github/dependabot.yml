version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    groups:
      github-actions:
        patterns: ["*"]
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  - package-ecosystem: "dotnet-sdk"
    directory: "/dotnet"
    schedule:
      interval: "weekly"
    labels:
      - ".NET"
      - "dependencies"
    cooldown:
      default-days: 7
