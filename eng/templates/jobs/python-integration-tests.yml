parameters:
  - name: azureServiceConnection
    type: string

jobs:
  - job: PythonIntegration
    displayName: 'Python integration tests'
    timeoutInMinutes: 90
    variables:
      DURABLE_TASK_SCHEDULER_CONNECTION_STRING: 'Endpoint=http://localhost:8080;TaskHub=default;Authentication=None'
      REDIS_CONNECTION_STRING: 'redis://localhost:6379'
    steps:
      - checkout: self

      - bash: |
          set -euo pipefail
          # Pin uv to the version declared in python/pyproject.toml for reproducible
          # CI. Astral publishes a versioned install script at astral.sh/uv/<version>.
          curl -LsSf https://astral.sh/uv/0.11.28/install.sh | sh
          echo "##vso[task.prependpath]$HOME/.local/bin"
        displayName: 'Install uv'

      - template: setup-integration-infra.yml

      - task: PipAuthenticate@1
        displayName: 'Authenticate to Azure Artifacts feed'
        inputs:
          artifactFeeds: 'internal/upstream'

      - bash: |
          set -euo pipefail
          uv python install 3.13
          uv sync --python 3.13 --all-packages --group dev --group test
        workingDirectory: python
        displayName: 'Sync Python workspace'
        env:
          # PipAuthenticate sets PIP_INDEX_URL (with a token) for the internal feed.
          # uv reads UV_INDEX_URL first, so point it at the same authenticated URL.
          UV_INDEX_URL: $(PIP_INDEX_URL)

      - bash: |
          set -euo pipefail

          missing=()
          for variable in \
            FOUNDRY_PROJECT_ENDPOINT \
            FOUNDRY_MODEL \
            AZURE_OPENAI_ENDPOINT \
            AZURE_OPENAI_MODEL
          do
            value="${!variable}"
            if [ -z "$value" ] || [[ "$value" =~ ^\$\(.+\)$ ]]; then
              missing+=("${variable}")
            fi
          done

          if (( ${#missing[@]} )); then
            echo "Missing required integration configuration: ${missing[*]}" >&2
            exit 1
          fi
        displayName: 'Validate Python integration configuration'
        env:
          FOUNDRY_PROJECT_ENDPOINT: $(FOUNDRY_PROJECT_ENDPOINT)
          FOUNDRY_MODEL: $(FOUNDRY_MODEL)
          AZURE_OPENAI_ENDPOINT: $(AZURE_OPENAI_ENDPOINT)
          AZURE_OPENAI_MODEL: $(AZURE_OPENAI_DEPLOYMENT_NAME)

      - task: AzureCLI@2
        displayName: 'Run Durable Task integration tests'
        inputs:
          azureSubscription: ${{ parameters.azureServiceConnection }}
          scriptType: bash
          scriptLocation: inlineScript
          workingDirectory: $(Build.SourcesDirectory)/python
          inlineScript: |
            set -euo pipefail
            mkdir -p ../artifacts/test-results
            uv run --no-sync pytest packages/durabletask/tests/integration_tests \
              -m integration \
              -n logical \
              --dist worksteal \
              --timeout 480 \
              --junitxml ../artifacts/test-results/python-durabletask-integration.xml
        env:
          FOUNDRY_PROJECT_ENDPOINT: $(FOUNDRY_PROJECT_ENDPOINT)
          FOUNDRY_MODEL: $(FOUNDRY_MODEL)
          AZURE_OPENAI_ENDPOINT: $(AZURE_OPENAI_ENDPOINT)
          AZURE_OPENAI_MODEL: $(AZURE_OPENAI_DEPLOYMENT_NAME)

      - task: AzureCLI@2
        displayName: 'Run Azure Functions integration tests'
        inputs:
          azureSubscription: ${{ parameters.azureServiceConnection }}
          scriptType: bash
          scriptLocation: inlineScript
          workingDirectory: $(Build.SourcesDirectory)/python
          inlineScript: |
            set -euo pipefail
            uv run --no-sync pytest packages/azurefunctions/tests/integration_tests \
              -m integration \
              -n logical \
              --dist worksteal \
              --timeout 480 \
              --junitxml ../artifacts/test-results/python-azurefunctions-integration.xml
        env:
          FOUNDRY_PROJECT_ENDPOINT: $(FOUNDRY_PROJECT_ENDPOINT)
          FOUNDRY_MODEL: $(FOUNDRY_MODEL)
          AZURE_OPENAI_ENDPOINT: $(AZURE_OPENAI_ENDPOINT)
          AZURE_OPENAI_MODEL: $(AZURE_OPENAI_DEPLOYMENT_NAME)
          AzureWebJobsStorage: 'UseDevelopmentStorage=true'
          FUNCTIONS_WORKER_RUNTIME: 'python'

      - task: PublishTestResults@2
        condition: always()
        inputs:
          testResultsFormat: JUnit
          testResultsFiles: 'artifacts/test-results/python-*-integration.xml'
          searchFolder: $(Build.SourcesDirectory)
          failTaskOnFailedTests: true
        displayName: 'Publish Python test results'
