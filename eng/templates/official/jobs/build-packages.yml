parameters:
  - name: artifactName
    type: string
    default: 'agent-framework-durable-extension-packages'
  # Gates the ESRP signing steps. Signing is only needed for packages that are actually
  # published, and eng/ci/package-release.yml deliberately keeps a dry run free of any
  # publishing credential dependency. Compile-time `${{ if }}` rather than a runtime
  # `condition:` for the same reason given there: 1ES validates referenced service
  # connections even for steps a runtime condition would skip.
  - name: publishDotNet
    type: boolean
    default: false

jobs:
  - job: BuildPackages
    displayName: 'Build package artifacts'
    templateContext:
      outputParentDirectory: $(Build.ArtifactStagingDirectory)
      outputs:
        - output: pipelineArtifact
          targetPath: $(Build.ArtifactStagingDirectory)/packages
          artifactName: ${{ parameters.artifactName }}
    steps:
      - checkout: self

      # ESRP signing requires the .NET 6 runtime, which is not present on the 1ES Windows image and is
      # not supplied by the global.json SDK below. Installed side by side; global.json still selects the
      # SDK the build uses. Matches microsoft/durabletask-dotnet eng/templates/build.yml.
      - ${{ if eq(parameters.publishDotNet, true) }}:
        - task: UseDotNet@2
          displayName: 'Use .NET 6 SDK (ESRP)'
          inputs:
            packageType: sdk
            version: '6.x'

      - task: UseDotNet@2
        displayName: 'Use .NET SDK from global.json'
        inputs:
          packageType: sdk
          useGlobalJson: true
          workingDirectory: dotnet

      - task: UsePythonVersion@0
        displayName: 'Use Python 3.13'
        inputs:
          versionSpec: '3.13'

      # Authenticate to the internal feed before installing uv. The governed pool
      # cannot reach PyPI directly, so pip must use the authenticated feed (via the
      # PIP_INDEX_URL this task sets) to install uv.
      - task: PipAuthenticate@1
        displayName: 'Authenticate to Azure Artifacts feed'
        inputs:
          artifactFeeds: 'internal/upstream'

      - pwsh: python -m pip install uv==0.11.28
        displayName: 'Install uv'

      - pwsh: Copy-Item "$(Build.SourcesDirectory)/eng/nuget.ci.config" "$(Build.SourcesDirectory)/dotnet/nuget.config" -Force
        displayName: 'Point NuGet at internal Azure Artifacts feed'

      - task: NuGetAuthenticate@1
        displayName: 'Authenticate to Azure Artifacts feed'

      - pwsh: dotnet restore agent-framework-durable-extension.slnx
        workingDirectory: dotnet
        displayName: 'Restore .NET solution'

      - pwsh: dotnet build agent-framework-durable-extension.slnx --configuration Release --no-restore
        workingDirectory: dotnet
        displayName: 'Build .NET solution'

      - pwsh: |
          New-Item -ItemType Directory -Force -Path ../artifacts/test-results | Out-Null
          dotnet test tests/Microsoft.Agents.AI.DurableTask.UnitTests/Microsoft.Agents.AI.DurableTask.UnitTests.csproj --configuration Release --no-build --report-xunit-trx --results-directory ../artifacts/test-results
          dotnet test tests/Microsoft.Agents.AI.Hosting.AzureFunctions.UnitTests/Microsoft.Agents.AI.Hosting.AzureFunctions.UnitTests.csproj --configuration Release --no-build --report-xunit-trx --results-directory ../artifacts/test-results
        workingDirectory: dotnet
        displayName: 'Run .NET unit tests'

      - task: PublishTestResults@2
        condition: always()
        displayName: 'Publish .NET test results'
        inputs:
          testResultsFormat: VSTest
          testResultsFiles: 'artifacts/test-results/**/*.trx'
          searchFolder: $(Build.SourcesDirectory)
          failTaskOnFailedTests: true

      # Authenticode-sign the assemblies before packing, mirroring
      # microsoft/durabletask-dotnet (eng/templates/build.yml). Note that the
      # SignAssembly/PublicSign settings in dotnet/Directory.Build.props only apply a
      # strong name with a public key so InternalsVisibleTo resolves; they are not
      # Authenticode and do not satisfy the official-package requirements.
      #
      # This runs after the unit tests so a failing build does not consume ESRP signing
      # operations, and before pack so the signed assemblies are the ones embedded in
      # the packages (the pack step below relies on --no-build to pick them up).
      - ${{ if eq(parameters.publishDotNet, true) }}:
        - template: ci/sign-files.yml@eng
          parameters:
            displayName: 'Sign .NET assemblies'
            folderPath: '$(Build.SourcesDirectory)/dotnet/src'
            pattern: '**/bin/Release/**/Microsoft.Agents.AI.*.dll'
            minimatch: true
            signType: dll

        # Fail loudly if signing matched nothing. A pattern that goes stale (for example
        # after a target-framework or output-path change) would otherwise sign zero files
        # and still succeed, shipping unsigned packages that look signed.
        - pwsh: |
            $srcDir = "$(Build.SourcesDirectory)/dotnet/src"
            $dlls = @(Get-ChildItem -Path $srcDir -Recurse -File -Filter 'Microsoft.Agents.AI.*.dll' |
              Where-Object { $_.FullName -replace '\\','/' -match '/bin/Release/' })
            if ($dlls.Count -eq 0) {
              throw "No built assemblies found under $srcDir; the signing pattern cannot have matched anything."
            }
            $unsigned = @($dlls | Where-Object { (Get-AuthenticodeSignature $_.FullName).Status -ne 'Valid' })
            if ($unsigned.Count -gt 0) {
              $names = ($unsigned | ForEach-Object { $_.Name }) -join ', '
              throw "These assemblies are not Authenticode signed after the signing step: $names"
            }
            Write-Host "Verified Authenticode signatures on $($dlls.Count) assemblies."
          displayName: 'Verify assembly signatures'

      - pwsh: |
          New-Item -ItemType Directory -Force -Path "$(Build.ArtifactStagingDirectory)/packages/dotnet" | Out-Null
          # Pass the output directory as an explicit MSBuild property rather than the
          # `dotnet pack --output` switch. On .NET SDK 10.0.3xx, `--output` is forwarded
          # to MSBuild as a bare `PackageOutputPath=<dir>` token (missing the -p: prefix),
          # which MSBuild treats as a second project and fails with MSB1008 ("Only one
          # project can be specified"). The whole -p: arg is quoted so PowerShell passes
          # it through as a single literal argument.
          dotnet pack src/Microsoft.Agents.AI.DurableTask/Microsoft.Agents.AI.DurableTask.csproj --configuration Release --no-build "-p:PackageOutputPath=$(Build.ArtifactStagingDirectory)/packages/dotnet"
          dotnet pack src/Microsoft.Agents.AI.Hosting.AzureFunctions.Extensions.DurableTask/Microsoft.Agents.AI.Hosting.AzureFunctions.Extensions.DurableTask.csproj --configuration Release --no-build "-p:PackageOutputPath=$(Build.ArtifactStagingDirectory)/packages/dotnet"
          dotnet pack src/Microsoft.Agents.AI.Hosting.AzureFunctions/Microsoft.Agents.AI.Hosting.AzureFunctions.csproj --configuration Release --no-build "-p:PackageOutputPath=$(Build.ArtifactStagingDirectory)/packages/dotnet"
        workingDirectory: dotnet
        displayName: 'Pack .NET packages'

      # Sign the packages themselves. `*.nupkg` deliberately does not match the
      # co-located `.snupkg` symbol packages, which are not signed.
      - ${{ if eq(parameters.publishDotNet, true) }}:
        - template: ci/sign-files.yml@eng
          parameters:
            displayName: 'Sign .NET NuGet packages'
            folderPath: '$(Build.ArtifactStagingDirectory)/packages/dotnet'
            pattern: '*.nupkg'
            signType: nuget

        # Same rationale as the assembly check above: confirm the packages really carry a
        # signature rather than trusting that the pattern matched.
        #
        # This also verifies the assemblies *inside* each package. The earlier check looks
        # at dotnet/src/**/bin/Release, which is only the same content because `pack` runs
        # with --no-build. If that flag were ever dropped, pack would rebuild and copy
        # unsigned obj/ assemblies over the signed ones, and a bin-only check would still
        # pass while the shipped lib/ assemblies were unsigned.
        - pwsh: |
            $dotnetDir = "$(Build.ArtifactStagingDirectory)/packages/dotnet"
            $nupkgs = @(Get-ChildItem -File -Path $dotnetDir -Filter *.nupkg)
            if ($nupkgs.Count -eq 0) {
              throw "No .nupkg packages were produced in $dotnetDir; the signing pattern cannot have matched anything."
            }
            foreach ($pkg in $nupkgs) {
              dotnet nuget verify $pkg.FullName
              if ($LASTEXITCODE -ne 0) {
                throw "$($pkg.Name) is not signed (dotnet nuget verify exited $LASTEXITCODE)."
              }
            }

            $extractRoot = Join-Path $env:AGENT_TEMPDIRECTORY 'nupkg-verify'
            Remove-Item -Recurse -Force $extractRoot -ErrorAction SilentlyContinue
            $totalLibDlls = 0
            foreach ($pkg in $nupkgs) {
              $dest = Join-Path $extractRoot $pkg.BaseName
              Expand-Archive -Path $pkg.FullName -DestinationPath $dest -Force
              $libDir = Join-Path $dest 'lib'
              if (-not (Test-Path $libDir)) {
                throw "$($pkg.Name) contains no lib/ directory; cannot verify the assemblies it ships."
              }
              $libDlls = @(Get-ChildItem -Path $libDir -Recurse -File -Filter 'Microsoft.Agents.AI.*.dll')
              if ($libDlls.Count -eq 0) {
                throw "$($pkg.Name) ships no Microsoft.Agents.AI.* assemblies under lib/."
              }
              $unsigned = @($libDlls | Where-Object { (Get-AuthenticodeSignature $_.FullName).Status -ne 'Valid' })
              if ($unsigned.Count -gt 0) {
                $names = ($unsigned | ForEach-Object { $_.FullName.Substring($dest.Length + 1) }) -join ', '
                throw "$($pkg.Name) ships assemblies that are not Authenticode signed: $names"
              }
              $totalLibDlls += $libDlls.Count
            }
            Remove-Item -Recurse -Force $extractRoot -ErrorAction SilentlyContinue

            Write-Host "Verified signatures on $($nupkgs.Count) packages and $totalLibDlls assemblies shipped inside them."
          displayName: 'Verify package signatures'

        # ESRP drops a CodeSignSummary-<guid>.md next to the signed packages. Nothing
        # consumes it and the push only globs *.nupkg, but leaving it here means it is
        # collected into the published pipeline artifact.
        - pwsh: |
            $dotnetDir = "$(Build.ArtifactStagingDirectory)/packages/dotnet"
            $summaries = @(Get-ChildItem -File -Path $dotnetDir -Filter 'CodeSignSummary-*.md' -ErrorAction SilentlyContinue)
            foreach ($f in $summaries) {
              Remove-Item -Force $f.FullName
              Write-Host "Removed ESRP artifact $($f.Name)."
            }
          displayName: 'Remove ESRP code-sign summaries'

      # Validate the packed .NET packages without pushing to a registry. This catches
      # packaging regressions early in a dry run: a missing co-located symbol package
      # (.snupkg), a missing/empty .nuspec, or a missing id/version. The symbol-package
      # check specifically guards the IncludeSymbols/snupkg setup in nuget-package.props.
      - pwsh: |
          $dotnetDir = "$(Build.ArtifactStagingDirectory)/packages/dotnet"
          $nupkgs = @(Get-ChildItem -File -Path $dotnetDir -Filter *.nupkg)
          if ($nupkgs.Count -eq 0) {
            throw "No .nupkg packages were produced in $dotnetDir."
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $failed = $false
          foreach ($pkg in $nupkgs) {
            $snupkg = [System.IO.Path]::ChangeExtension($pkg.FullName, ".snupkg")
            if (-not (Test-Path $snupkg)) {
              Write-Host "##[error]Missing symbol package for $($pkg.Name) (expected $([System.IO.Path]::GetFileName($snupkg)))."
              $failed = $true
            }

            try {
              $zip = [System.IO.Compression.ZipFile]::OpenRead($pkg.FullName)
            } catch {
              Write-Host "##[error]Unable to read $($pkg.Name) as a NuGet package: $($_.Exception.Message)"
              $failed = $true
              continue
            }
            try {
              $entry = $zip.Entries | Where-Object { $_.FullName.EndsWith(".nuspec") } | Select-Object -First 1
              if ($null -eq $entry) {
                Write-Host "##[error]$($pkg.Name) does not contain a .nuspec."
                $failed = $true
              } else {
                $reader = New-Object System.IO.StreamReader($entry.Open())
                try { $nuspecXml = $reader.ReadToEnd() } finally { $reader.Dispose() }
                # Parse defensively: an empty or malformed .nuspec would make the [xml]
                # cast throw and abort the whole loop, skipping remaining packages and
                # the aggregated summary below. Treat a parse failure as this package's
                # validation failure and continue.
                $nuspec = $null
                try {
                  $nuspec = [xml]$nuspecXml
                } catch {
                  Write-Host "##[error]$($pkg.Name) has an invalid or empty .nuspec: $($_.Exception.Message)"
                  $failed = $true
                }
                if ($null -ne $nuspec) {
                  # Extract id/version via XPath with local-name() so the lookup is
                  # namespace-agnostic: the generated .nuspec declares a default xmlns
                  # (nuspec.xsd), and namespace-qualified element access is fragile.
                  $idNode = $nuspec.SelectSingleNode("/*[local-name()='package']/*[local-name()='metadata']/*[local-name()='id']")
                  $versionNode = $nuspec.SelectSingleNode("/*[local-name()='package']/*[local-name()='metadata']/*[local-name()='version']")
                  # SelectSingleNode returns $null when the element is absent; guard so a
                  # missing id/version is reported cleanly instead of throwing (which would
                  # also occur under Set-StrictMode).
                  $id = if ($null -ne $idNode) { $idNode.InnerText } else { $null }
                  $version = if ($null -ne $versionNode) { $versionNode.InnerText } else { $null }
                  if ([string]::IsNullOrWhiteSpace($id) -or [string]::IsNullOrWhiteSpace($version)) {
                    Write-Host "##[error]$($pkg.Name) is missing id or version in its .nuspec."
                    $failed = $true
                  } else {
                    Write-Host "Validated $id $version ($($pkg.Name))"
                  }
                }
              }
            } finally {
              $zip.Dispose()
            }
          }

          if ($failed) {
            throw "One or more .NET packages failed validation."
          }
        displayName: 'Validate .NET packages'

      - pwsh: uv sync --all-packages --group dev --group test
        workingDirectory: python
        displayName: 'Sync Python workspace'
        env:
          UV_INDEX_URL: $(PIP_INDEX_URL)

      - pwsh: uv run ruff check packages/durabletask packages/azurefunctions
        workingDirectory: python
        displayName: 'Run Python lint'

      # Type checking covers only packages/durabletask. The azurefunctions package is
      # type checked with pyright instead (see .github/workflows/python-merge-tests.yml),
      # because mypy cannot analyze it: azure.durable_functions ships no py.typed marker,
      # so every import of it raises import-untyped. Do not add azurefunctions here
      # without switching this step to pyright.
      - pwsh: uv run mypy --config-file packages/durabletask/pyproject.toml packages/durabletask/agent_framework_durabletask
        workingDirectory: python
        displayName: 'Run Python type check'

      - pwsh: |
          New-Item -ItemType Directory -Force -Path ../artifacts/test-results | Out-Null
          uv run pytest -m "not integration" packages/durabletask/tests packages/azurefunctions/tests --junitxml ../artifacts/test-results/python-unit.xml
        workingDirectory: python
        displayName: 'Run Python unit tests'

      - task: PublishTestResults@2
        condition: always()
        displayName: 'Publish Python test results'
        inputs:
          testResultsFormat: JUnit
          testResultsFiles: 'artifacts/test-results/python-unit.xml'
          searchFolder: $(Build.SourcesDirectory)
          failTaskOnFailedTests: true

      - pwsh: |
          New-Item -ItemType Directory -Force -Path "$(Build.ArtifactStagingDirectory)/packages/python" | Out-Null
          uv build packages/durabletask --out-dir "$(Build.ArtifactStagingDirectory)/packages/python"
          uv build packages/azurefunctions --out-dir "$(Build.ArtifactStagingDirectory)/packages/python"
        workingDirectory: python
        displayName: 'Build Python packages'
        env:
          # uv build resolves the build backend (flit-core) in an isolated environment.
          # The governed pool blocks PyPI, so point uv at the authenticated internal feed.
          UV_INDEX_URL: $(PIP_INDEX_URL)

      # Validate the built Python distributions without uploading. `twine check`
      # verifies the package metadata (including that the long description renders on
      # PyPI), catching issues that would otherwise only surface at publish time.
      # twine is installed from the internal feed (pip is authenticated above) and
      # pinned for reproducible CI, consistent with the pinned uv version.
      - pwsh: |
          python -m pip install twine==6.1.0
          $pythonDir = "$(Build.ArtifactStagingDirectory)/packages/python"
          $dists = @(Get-ChildItem -File -Path $pythonDir |
            Where-Object { $_.Name.EndsWith(".whl") -or $_.Name.EndsWith(".tar.gz") })
          if ($dists.Count -eq 0) {
            throw "No Python distributions were produced in $pythonDir."
          }

          # Assert every shipping workspace package produced a distribution. The publish
          # job hands ESRP this whole folder, so a package missing here is silently not
          # released rather than failing loudly.
          foreach ($expected in @('agent_framework_durabletask', 'agent_framework_azurefunctions')) {
            if (-not ($dists | Where-Object { $_.Name.StartsWith("$expected-") })) {
              throw "No distribution was produced for '$expected' in $pythonDir."
            }
          }
          python -m twine check @($dists.FullName)
        displayName: 'Validate Python package (twine check)'

      - pwsh: Get-ChildItem -Recurse "$(Build.ArtifactStagingDirectory)/packages" | Select-Object -ExpandProperty FullName
        displayName: 'List package artifacts'
